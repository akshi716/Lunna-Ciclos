



<!DOCTYPE html>


<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
</head>


<body>
    <a href="inicio">


        <img src="#" alt="logo">


    </a>




    <span id="dataAtualLogo"></span>


    <span id="cumprimentoUser"></span>


    <span id="icon"></span>


    <h3> ESPAÇO DE AUTOCUIDADO </h3>


    <h2>Seu ciclo, no seu ritmo</h2>


    <p>


        Acompanhe as fases e reconheça os sinais
        do seu corpo com mais clareza.


    </p>




    <div id="faseAtual">


        <h3>FASE ATUAL</h3>


        <span id="tituloFaseAtual">Fase folicular</span>


        <span id="textoFaseAtual"></span>


        <button id="maisFase">Entender esta fase </button>


        <div id="diaCiclo">


            <img src="#" alt="efeitoDia">


            <span></span>


            <p>dia do ciclo</p>


        </div>


    </div>


    <main class="calendar-card">


        <div class="calendar-header">


            <div>
                <span class="calendar-label">▦ VISÃO MENSAL</span>


                <h1>
                    <span id="month"></span>
                    <span id="year"></span>
                </h1>
            </div>


            <div class="navigation">
                <button id="previousMonth"></button>
                <button id="nextMonth"></button>
            </div>


        </div>




        <div class="weekdays">


            <span>SEG</span>
            <span>TER</span>
            <span>QUA</span>
            <span>QUI</span>
            <span>SEX</span>
            <span>SÁB</span>
            <span>DOM</span>


        </div>




        <div id="calendar" class="calendar">
            <!-- Os dias serão criados pelo JavaScript -->
        </div>




        <div class="legend">


            <div>
                <span class="dot period"></span>
                Menstruação
            </div>


            <div>
                <span class="dot fertile"></span>
                Fase Fértil
            </div>


            <div>
                <span class="dot ovulation"></span>
                Ovulação
            </div>


            <div>
                <span class="dot today"></span>
                Hoje
            </div>


        </div>


    </main>

</body>


</html>
