<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil | Lunna</title>
    <link rel="stylesheet" href="../Style/style.css">
    <link rel="stylesheet" href="../Style/perfil.css">
    <link rel="stylesheet" href="../Style/menu.css">
    <link rel="stylesheet" href="../Style/responsivo.css">
</head>




<body class="pagina-perfil-body">
  <main class="pagina">
    <header class="topo">



      <h1 class="saudacao">
        <span id="cumprimentoUser"></span>
      </h1>





      <div class="acoes-topo">
        <div class="avatar-mini">
          <img src="../img/PERFIL.png" id="avatarMini" alt="Foto de perfil" />
        </div>
      </div>
    </header>


    <h2 class="titulo-principal">Meu perfil de saúde</h2>
    <a href="../pages/index.html" class="voltar"> ← &nbsp; Voltar ao início </a>





    <section class="conteudo">
      <article class="card">
        <div class="perfil-topo">
          <div class="perfil-info">
            <div class="avatar" id="avatarUsuario"></div>




            <div>
              <p class="label">Seu perfil</p>




              <h3 class="nome" id="userName"></h3>




              <p class="texto-suave">Seu espaço é só seu.</p>
            </div>
          </div>




          <button class="btn-editar" id="editarPerfil" type="button">
            Editar perfil
          </button>
        </div>




        <div class="estatisticas">
          <div class="estatistica">
            <strong id="idadeUsuario"></strong>
            <span>anos</span>
          </div>




          <div class="estatistica">
            <strong id="pesoUsuario"></strong>
            <span>kg</span>
          </div>


          <div class="estatistica">
            <strong id="alturaUsuario"></strong>
            <span>m</span>
          </div>




          <div class="estatistica">
            <strong id="imcUsuario"></strong>
            <span>IMC</span>
          </div>
        </div>




        <!-- SUS -->
        <div class="sus">
          <div class="sus-info">

            <span>Número do SUS protegido</span>
            <span class="cadeado">🔒︎</span>
          </div>




          <div class="numero-sus" id="numeroSus"></div>
        </div>
      </article>




      <article class="card">
        <div class="historico-topo">
          <div>
            <p class="label">Histórico</p>




            <h3 class="historico-titulo">Seus exames</h3>
          </div>




          <div class="exame-upload" id="adicionarExame">
            <label for="inputExame">Adicionar exame</label>
            <input type="file" id="inputExame" accept=".pdf,.jpg,.jpeg,.png" aria-describedby="formatosExame" />
            <span id="formatosExame">PDF, JPG ou PNG</span>
          </div>
        </div>




        <!-- LISTA DE EXAMES -->
        <div class="exames" id="listaExames"></div>
      </article>
    </section>
  </main>

  <dialog id="modalPerfil" aria-labelledby="tituloEditarPerfil">
    <form id="formPerfil">
      <h2 id="tituloEditarPerfil">Editar perfil</h2>

      <label for="nomePerfil">Nome</label>
      <input id="nomePerfil" name="nome" type="text" autocomplete="name" required autofocus />

      <label for="idadePerfil">Idade (anos)</label>
      <input id="idadePerfil" name="idade" type="number" min="0" step="1" />

      <label for="pesoPerfil">Peso (kg)</label>
      <input id="pesoPerfil" name="peso" type="number" min="0.1" step="0.1" />

      <label for="alturaPerfil">Altura (m)</label>
      <input id="alturaPerfil" name="altura" type="number" min="0.01" step="0.01" placeholder="1,65" />

      <div class="acoes-edicao-perfil">
        <button class="btn-editar" id="cancelarEdicao" type="button">Cancelar</button>
        <button class="btn-editar" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>
