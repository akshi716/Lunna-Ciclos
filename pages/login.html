<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lunna</title>
</head>

<body>
    <main>
        <header>
            <div aria-label="Logo Lunna">
                <span aria-hidden="true">🌙</span>
                <span>Lunna</span>
            </div>

            <h1>Bem-vinda ao seu ciclo</h1>

            <p>
                Cuide de você em todas as fases e acompanhe seu bem-estar com carinho.
            </p>
        </header>

        <section aria-labelledby="titulo-login">
            <h2 id="titulo-login">Entrar na sua conta</h2>
            <p>Continue sua jornada de autoconhecimento.</p>

            <form action="#" method="post">

                <div>
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="lembrar"
                        name="lembrar"
                    >

                    <label for="lembrar">
                        Lembrar de mim
                    </label>

                    <a href="#recuperar-senha">
                        Esqueci minha senha
                    </a>
                </div>

                <button type="submit">Entrar</button>
            </form>
        </section>

        <div aria-hidden="true">✦</div>

        <p>
            Ainda não tem uma conta?
            <a href="#criar-conta">Criar conta</a>
        </p>

        <footer>
            <p>Seus dados são protegidos com segurança e privacidade.</p>
        </footer>
    </main>

    <script src="login.js"></script>
</body>
</html>
