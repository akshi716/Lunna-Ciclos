<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lunna</title>
    <link rel="stylesheet" href="../Style/style.css">
    <link rel="stylesheet" href="../Style/login.css">
    <link rel="stylesheet" href="../Style/menu.css">
    <link rel="stylesheet" href="../Style/responsivo.css">
</head>




<body class="pagina-login-body">
    <main class="pagina-login">
        <header class="login-topo">
            <div aria-label="Logo Lunna">
                <h2>Lunna ✦</h2>
            </div>




            <h1>Bem-vinda ao seu ciclo</h1>




            <p>
                Cuide de você em todas as fases e acompanhe seu bem-estar com carinho.
            </p>
        </header>




        <section class="login-card" aria-labelledby="titulo-login">
            <h2 id="titulo-login">Entrar na sua conta</h2>
            <form id="login-form" action="#" method="post">




                <div>
                    <label for="email">E-mail</label>




                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email"
                        required>
                </div>




                <div>
                    <label for="password">Senha</label>




                    <input type="password" id="password" name="password" placeholder="Digite sua senha"
                        autocomplete="current-password" minlength="6" required>
                </div>




                <div>
                    <input type="checkbox" id="lembrar" name="remember">




                    <label for="lembrar">
                        Lembrar de mim
                    </label>




                    <a id="forgot-link" href="#recuperar-senha">
                        Esqueci minha senha
                    </a>
                </div>




                <button type="submit">Entrar</button>
            </form>
        </section>
        <p>
            Ainda não tem uma conta?
            <a id="create-link" href="#criar-conta">Criar conta</a>
        </p>
        <p class="mensagem-login" id="message" aria-live="polite"></p>




        <footer>
            <p>Seus dados são protegidos com segurança e privacidade.</p>
        </footer>
    </main>




    <script src="../Script/login.js"></script>

    <script src="https://unpkg.com/lucide@latest" async onload="window.lucide?.createIcons()"></script>
    <script src="../Script/menu.js"></script>

</body>

</html>
